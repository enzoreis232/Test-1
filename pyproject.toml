[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "bacbo-analytics-pro"
version = "1.0.0"
description = "Dashboard desktop de observação visual e análise estatística do Bac Bo"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["bacbo_analytics*"]

[tool.pytest.ini_options]
testpaths = ["tests", "test_bacbo_bot.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
