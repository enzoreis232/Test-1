name: Windows desktop package

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    name: Build and smoke-test Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install verified dependency packages
        run: python -m pip install -r requirements-dev.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Tests, packaging and frozen application smoke test
        shell: pwsh
        run: ./scripts/package_windows.ps1
      - name: Publish Windows ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BacBoAnalyticsPro-Windows
          path: dist/BacBoAnalyticsPro-Windows.zip
          if-no-files-found: error
          retention-days: 30
